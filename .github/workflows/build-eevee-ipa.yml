name: Build spoti.pw with EeveeSpotifyReincarnated

on:
  workflow_dispatch:
    inputs:
      base_run_id:
        description: Successful Build IPA run containing the spoti.ipa artifact
        required: true
        default: '36457343317'
        type: string
  push:
    branches: [codex/eevee-integration]
    paths:
      - .github/workflows/build-eevee-ipa.yml
      - integrations/eevee/**

permissions:
  contents: read
  actions: read

concurrency:
  group: eevee-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      THEOS: ${{ github.workspace }}/deps/theos
      EEVEE_COMMIT: ca363e63efd4730811a241ec48a5c0e4ef838112
      BASE_RUN_ID: ${{ inputs.base_run_id || '36457343317' }}
      SWIFTPROTOBUF_VERSION: '1.29.0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          name: spoti.ipa
          path: input
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_RUN_ID }}

      - name: Validate original Spotify IPA
        run: python3 integrations/eevee/verify_package.py input

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          ref: dd5c14bb9d91311e221d51b5bfb8c9e5948156db
          path: deps/theos
          submodules: recursive
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: SideloadLabs/EeveeSpotifyReincarnated
          ref: ${{ env.EEVEE_COMMIT }}
          path: deps/eevee
          submodules: recursive
          persist-credentials: false

      - name: Install build tools
        run: |
          brew install make dpkg ldid wget
          python3 -m pip install --break-system-packages 'git+https://github.com/asdfzxcvbn/pyzule-rw.git@740d3716dcd98c20c000f12cdb88f1f0b2a533a4'
          arch=$(uname -m); [ "$arch" = "x86_64" ] && suffix=macos-amd64 || suffix=macos-arm64
          curl -fsSL "https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.${suffix}" -o "$RUNNER_TEMP/ipapatch"
          chmod +x "$RUNNER_TEMP/ipapatch"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p "$THEOS/sdks"
          ln -s "$sdk" "$THEOS/sdks/$(basename "$sdk")"
          "$RUNNER_TEMP/ipapatch" --help >/dev/null

      - name: Prepare Reincarnated and add spoti.pw tools
        run: python3 integrations/eevee/prepare_eevee.py deps/eevee

      - name: Build renamed SwiftProtobuf framework
        working-directory: deps/eevee
        run: bash Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      - name: Build Eevee package
        working-directory: deps/eevee
        env:
          REPO_SLUG: dx1ctrl/spoti.pw
          THEOS_PACKAGE_SCHEME: rootless
        run: env -u MAKELEVEL gmake clean package FINALPACKAGE=1

      - name: Build the sideload compatibility library
        working-directory: deps/eevee
        env:
          THEOS_PACKAGE_SCHEME: rootless
        run: bash Tools/build-zxpi.sh

      - name: Inject Eevee into the original IPA
        run: |
          mkdir -p out "$RUNNER_TEMP/eevee-package"
          shopt -s nullglob
          inputs=(input/*.ipa)
          packages=(deps/eevee/packages/com.eevee.spotify_*.deb)
          test "${#inputs[@]}" -eq 1
          test "${#packages[@]}" -eq 1
          dpkg-deb -R "${packages[0]}" "$RUNNER_TEMP/eevee-package"
          dylib=$(find "$RUNNER_TEMP/eevee-package" -name EeveeSpotify.dylib -type f -print -quit)
          framework=$(find "$RUNNER_TEMP/eevee-package" -type d -name EeveeSwiftProtobuf.framework -print -quit)
          bundle=$(find "$RUNNER_TEMP/eevee-package" -type d -name EeveeSpotify.bundle -print -quit)
          test -n "$dylib" && test -n "$framework" && test -n "$bundle"
          cyan -i "${inputs[0]}" -o out/spoti.pw-0.22.0-reincarnated.ipa -f "$dylib" "$framework" "$bundle" -s --overwrite
          ipapatch --input out/spoti.pw-0.22.0-reincarnated.ipa --inplace --noconfirm --dylib deps/eevee/packages/zxPluginsInject.dylib
          python3 integrations/eevee/verify_package.py out --combined --base "${inputs[0]}"
          cp deps/eevee/LICENSE out/EeveeSpotifyReincarnated-LICENSE.txt
          cp "${packages[0]}" out/
          tar --exclude=.git --exclude=.theos --exclude=packages --exclude=extra_dylibs -czf out/EeveeSpotifyReincarnated-source.tar.gz -C deps/eevee .
          shasum -a 256 out/*.ipa > out/SHA256SUMS.txt
          printf 'Spotify: 9.1.78\nspoti.pw: 0.22.0\nEevee: SideloadLabs/EeveeSpotifyReincarnated\nEevee commit: %s\nBase run: %s\nBuild run: %s\nBuild commit: %s\nIncludes spoti.pw Song tools and Visuals 2 recovery.\nThe upstream source was last documented against Spotify 9.1.88; this package uses the verified 9.1.78 base and needs device playback verification.\nEevee lyrics replacement is disabled to preserve spoti.pw lyrics.\nVisual effects remain off at launch; explicitly apply a style each session.\n' "$EEVEE_COMMIT" "$BASE_RUN_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" > out/BUILD-INFO.txt

      - uses: actions/upload-artifact@v5
        with:
          name: spoti-reincarnated
          path: out/*
          if-no-files-found: error
          retention-days: 30
